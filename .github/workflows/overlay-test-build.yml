name: Signed overlay test build
on:
  push:
    branches: [codex/fix-overlay-detection]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'tatoalo/strafe'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Above the installed 0.2.3 (601), below the next normal release (701).
      BUILD_NUMBER: '602'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and bundle
        run: |
          set -euo pipefail
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          bash Tests/run.sh
          bash Tests/hotkeys.sh
          python3 -m unittest discover -s Tests -p 'test_*.py'
          Scripts/bundle.sh
      - name: Sign and notarize test app
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          test_keychain="$RUNNER_TEMP/strafe-overlay-test.keychain-db"
          test_password="$(openssl rand -hex 32)"
          echo "::add-mask::$test_password"
          security create-keychain -p "$test_password" "$test_keychain"
          security set-keychain-settings -lut 3600 "$test_keychain"
          security unlock-keychain -p "$test_password" "$test_keychain"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -d > "$RUNNER_TEMP/strafe-overlay-test.p12"
          security import "$RUNNER_TEMP/strafe-overlay-test.p12" -k "$test_keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$test_password" "$test_keychain" >/dev/null
          security list-keychains -d user -s "$test_keychain"
          rm "$RUNNER_TEMP/strafe-overlay-test.p12"
          SIGNING_IDENTITY='Developer ID Application: Alessandro Pogliaghi (X8NRPB5BZ5)' Scripts/sign.sh build/strafe-tatoalo.app
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/strafe-overlay-test.p8"
          ditto -c -k --keepParent build/strafe-tatoalo.app "$RUNNER_TEMP/strafe-overlay-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/strafe-overlay-notary.zip" --key "$RUNNER_TEMP/strafe-overlay-test.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple build/strafe-tatoalo.app
          codesign --verify --deep --strict build/strafe-tatoalo.app
          spctl --assess --type execute build/strafe-tatoalo.app
          ditto -c -k --keepParent build/strafe-tatoalo.app build/strafe-tatoalo-overlay-test.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strafe-tatoalo-overlay-test
          path: build/strafe-tatoalo-overlay-test.zip
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/strafe-overlay-test.keychain-db" || true
          rm -f "$RUNNER_TEMP/strafe-overlay-test.p12" "$RUNNER_TEMP/strafe-overlay-test.p8" "$RUNNER_TEMP/strafe-overlay-notary.zip"
