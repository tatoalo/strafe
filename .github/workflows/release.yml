name: Release
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish a test build without updating the stable feed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'tatoalo/strafe' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        contains(github.event.pull_request.labels.*.name, 'release')))
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PRERELEASE: ${{ inputs.prerelease == true }}
    outputs:
      stable: ${{ steps.metadata.outputs.stable }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Validate source
        run: |
          swift --version
          swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
          bash Tests/run.sh
          bash Tests/hotkeys.sh
          python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Set immutable release identity
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          TAG="strafe-tatoalo-v$VERSION"
          if [[ "$PRERELEASE" == true ]]; then TAG="$TAG-beta.$BUILD_NUMBER"; fi
          if gh release view "$TAG" --json isDraft --jq 'select(.isDraft == false)' | grep -q .; then
            echo "::error::Release $TAG already exists; increase VERSION."
            exit 1
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "stable=$([[ "$PRERELEASE" == true ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: Import release credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/strafe-release.keychain-db"
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/developer-id.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$IDENTITY"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials strafe-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --keychain "$KEYCHAIN"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=strafe-notary" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and verify
        run: ./Scripts/release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$(git rev-parse HEAD)" --draft --title "strafe-tatoalo $VERSION" --notes-file "release-notes/$VERSION.md"
          fi
          python3 Scripts/prepare-feed.py build/dist/appcast.xml
          gh release upload "$RELEASE_TAG" build/dist/*.dmg build/dist/SHA256SUMS build/dist/appcast.xml --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          python3 Scripts/verify-published.py "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strafe-tatoalo-release-${{ env.BUILD_NUMBER }}
          path: build/dist/
          retention-days: 30
      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/strafe-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
